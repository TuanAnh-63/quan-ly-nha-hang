<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Đơn Nhà Hàng</title>
    <style>
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f9f9f9; color: #333; line-height: 1.6; }
        
    
        .navbar {
            display: flex;
            background: #fff;
            padding: 15px 20px;
            overflow-x: auto;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-item {
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: bold;
            color: #666;
            transition: all 0.3s;
        }
        .nav-item:hover, .nav-item.active {
            color: #d32f2f;
            border-bottom: 2px solid #d32f2f;
        }

        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s;
        }
        .product-card:hover { transform: translateY(-5px); }
        .product-img { width: 100%; height: 250px; object-fit: cover; }
        .product-info { padding: 15px; }
        .product-title { font-size: 16px; margin-bottom: 10px; color: #d32f2f; }
        .product-price { font-weight: bold; font-size: 14px; }

    
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; overflow: auto;
            background-color: rgba(0,0,0,0.6);
        }
        .modal-content {
            background-color: #fff; margin: 5% auto; padding: 30px;
            border-radius: 8px; max-width: 900px; position: relative;
        }
        .close-btn {
            position: absolute; top: 15px; right: 20px;
            color: #aaa; font-size: 28px; font-weight: bold; cursor: pointer;
        }
        .close-btn:hover { color: #333; }
        
        .modal-body { display: flex; flex-wrap: wrap; gap: 30px; }
        .modal-left { flex: 1; min-width: 300px; }
        .modal-left img { width: 100%; border-radius: 8px; }
        
        .modal-right { flex: 1; min-width: 300px; }
        .m-title { font-size: 28px; margin-bottom: 15px; }
        .m-price { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        
        .m-options { margin-bottom: 20px; }
        .m-options label { display: block; margin-bottom: 8px; font-size: 14px;}
        
        .m-actions { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .qty-box { display: flex; border: 1px solid #ccc; border-radius: 4px; }
        .qty-box button { background: none; border: none; padding: 10px 15px; cursor: pointer; font-size: 16px; }
        .qty-box input { width: 40px; text-align: center; border: none; border-left: 1px solid #ccc; border-right: 1px solid #ccc; }
        
        .btn-add-cart {
            background-color: #e57373; color: white; border: none;
            padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer;
        }
        .btn-add-cart:hover { background-color: #d32f2f; }
        .m-wishlist { color: #666; font-size: 14px; margin-bottom: 20px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
       
        .m-description-section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .tab-title { font-weight: bold; border-bottom: 2px solid #333; display: inline-block; padding-bottom: 5px; margin-bottom: 15px; font-size: 14px; text-transform: uppercase;}
        .m-desc-text { font-size: 14px; color: #555; white-space: pre-line; }

    
        @media (max-width: 768px) {
            .modal-body { flex-direction: column; }
        }
    </style>
</head>
<body>


    <nav class="navbar" id="navbar">
     
    </nav>

 
    <div class="container">
        <div class="grid" id="product-grid">
         
        </div>
    </div>


    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <div class="modal-left">
                    <img id="modal-img" src="" alt="Product Image">
                </div>
                <div class="modal-right">
                    <h1 class="m-title" id="modal-title">Tên món</h1>
                    <div class="m-price" id="modal-price">Giá</div>
                    
                    <div class="m-options" id="modal-options">
                       
                    </div>

                    <div class="m-actions">
                        <div class="qty-box">
                            <button>-</button>
                            <input type="text" value="1" readonly>
                            <button>+</button>
                        </div>
                        <button class="btn-add-cart">THÊM VÀO GIỎ HÀNG</button>
                    </div>

                    <div class="m-wishlist">♡ Add to wishlist</div>

                   
                    <div class="m-description-section">
                        <div class="tab-title">MÔ TẢ</div>
                        <div class="m-desc-text" id="modal-desc">
                            Nội dung mô tả món ăn sẽ hiển thị ở đây.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

              desc: "Sụn heo tươi giòn sần sật.\nSize M: 200g\nSize L: 300g" },
            { id: 13, category: "Thịt nhúng lẩu", name: "Bắp bò tươi", price: "90.000 ₫ – 130.000 ₫", optionType: "size",

              desc: "Bắp bò hoa tươi ngon cắt lát chuẩn nhúng lẩu.\nSize M: 200g\nSize L: 300g" },

          
            { id: 14, category: "Đồ uống", name: "Coca Cola - lon 320ml", price: "15.000 ₫", optionType: "none", 
              img: "https://cdn.tgdd.vn/Products/Images/2565/76467/bhx/nuoc-ngot-coca-cola-320ml-202312141339176313.jpg",
              desc: "Nước giải khát Coca Cola lon 320ml chính hãng, mát lạnh." }
        ];

       
        const categories = [...new Set(products.map(p => p.category))];
        let currentCategory = categories[0];

    
        function renderNav() {
            const nav = document.getElementById('navbar');
            nav.innerHTML = '';
            categories.forEach(cat => {
                const div = document.createElement('div');
                div.className = `nav-item ${cat === currentCategory ? 'active' : ''}`;
                div.innerText = cat;
                div.onclick = () => {
                    currentCategory = cat;
                    renderNav();
                    renderProducts();
                };
                nav.appendChild(div);
            });
        }

       
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            const filtered = products.filter(p => p.category === currentCategory);
            
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
           
                card.onclick = () => openModal(p.id);
                
                card.innerHTML = `
                    <img src="${p.img}" class="product-img" alt="${p.name}">
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

    
        function openModal(productId) {
            const product = products.find(p => p.id === productId);
            
            document.getElementById('modal-img').src = product.img;
            document.getElementById('modal-title').innerText = product.name;
            document.getElementById('modal-price').innerText = product.price;
            document.getElementById('modal-desc').innerText = product.desc;

            const optionsDiv = document.getElementById('modal-options');
            optionsDiv.innerHTML = '';
            
            if (product.optionType === 'combo') {
                optionsDiv.innerHTML = `
                    <p style="font-size:12px; color:#666; margin-bottom:5px;">Chọn Set Combo</p>
                    <label><input type="radio" name="opt" checked> Combo Lẩu Cho 2-3 Người</label>
                    <label><input type="radio" name="opt"> Combo Lẩu Cho 4-6 Người</label>
                `;
            } else if (product.optionType === 'size') {
                optionsDiv.innerHTML = `
                    <p style="font-size:12px; color:#666; margin-bottom:5px;">Chọn Size</p>
                    <label><input type="radio" name="opt" checked> Size M</label>
                    <label><input type="radio" name="opt"> Size L</label>
                `;
            }

            document.getElementById('product-modal').style.display = 'block';
        }

     
        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

     
        window.onclick = function(event) {
            const modal = document.getElementById('product-modal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        
        renderNav();
        renderProducts();
    </script>
</body>
</html>
