<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập & Đăng Ký - Nhà Hàng</title>
    <!-- Font Awesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css_login.css">
</head>
<body>

    <div class="auth-wrapper">
        <!-- NÚT CHUYỂN TAB -->
        <div class="auth-tabs">
            <button class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">Đăng Nhập</button>
            <button class="tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">Đăng Ký</button>
        </div>

        <!-- FORM ĐĂNG NHẬP -->
        <div class="auth-form" id="loginFormContainer">
            <h2 style="text-align: center; margin-bottom: 20px; color: #800f2f;">Đăng Nhập Tài Khoản</h2>
            
            <!-- Khung báo lỗi -->
            <div id="loginError" class="alert-error" style="display: none; color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-size: 13px;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email hoặc Số điện thoại <span class="required-star">*</span></label>
                    <div class="input-box">
                        <i class="fa-solid fa-user icon"></i>
                        <input type="text" id="loginEmail" placeholder="Nhập email hoặc số điện thoại..." required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label>Mật khẩu <span class="required-star">*</span></label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock icon"></i>
                        <input type="password" id="loginPassword" placeholder="Nhập mật khẩu..." required autocomplete="current-password">
                        <i class="fa-solid fa-eye toggle-password"></i>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px;">
                    <label style="cursor: pointer;"><input type="checkbox" id="rememberMe"> Ghi nhớ đăng nhập</label>
                    <a href="quenmatkhau.html" class="forgot-pass">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-submit">ĐĂNG NHẬP</button>
            </form>
        </div>

        <!-- FORM ĐĂNG KÝ -->
        <div class="auth-form" id="registerFormContainer" style="display: none;">
            <h2 style="text-align: center; margin-bottom: 20px; color: #800f2f;">Tạo Tài Khoản Mới</h2>

            <!-- Khung báo lỗi/thành công đăng ký -->
            <div id="registerMsg" class="alert-msg" style="display: none; padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-size: 13px;"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Họ và Tên <span class="required-star">*</span></label>
                    <div class="input-box">
                        <i class="fa-solid fa-id-card icon"></i>
                        <input type="text" id="regFullName" placeholder="Nhập họ và tên..." required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email <span class="required-star">*</span></label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope icon"></i>
                        <input type="email" id="regEmail" placeholder="Nhập email của bạn..." required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label>Mật khẩu <span class="required-star">*</span></label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock icon"></i>
                        <input type="password" id="regPassword" placeholder="Tạo mật khẩu..." required autocomplete="new-password">
                        <i class="fa-solid fa-eye toggle-password"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Xác nhận Mật khẩu <span class="required-star">*</span></label>
                    <div class="input-box">
                        <i class="fa-solid fa-shield-halved icon"></i>
                        <input type="password" id="regConfirmPassword" placeholder="Nhập lại mật khẩu..." required autocomplete="new-password">
                        <i class="fa-solid fa-eye toggle-password"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">TẠO TÀI KHOẢN</button>
            </form>
        </div>
    </div>

    <script src="js_login.js"></script>
</body>
</html>
