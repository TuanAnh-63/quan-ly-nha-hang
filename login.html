<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập & Đăng Ký - Nhà Hàng</title>
    <!-- Font Awesome dùng cho Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css_login.css">
</head>
<body>
    <div class="auth-wrapper">
        <!-- Tab chuyển đổi Đăng Nhập / Đăng Ký -->
        <div class="auth-header">
            <button id="tabLogin" class="tab-btn active" type="button" onclick="switchTab('login')">Đăng Nhập</button>
            <button id="tabRegister" class="tab-btn" type="button" onclick="switchTab('register')">Đăng Ký</button>
        </div>

        <!-- FORM ĐĂNG NHẬP -->
        <form id="loginForm" class="auth-form active" novalidate>
            <h2>Đăng Nhập Tài Khoản</h2>
            
            <!-- Thông báo -->
            <div id="loginGlobalError" class="alert-box danger hidden">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="loginGlobalErrorText">Tài khoản hoặc mật khẩu không chính xác!</span>
            </div>

            <div class="form-group">
                <label for="loginEmail">Email hoặc Số điện thoại <span class="required-star">*</span></label>
                <div class="input-box">
                    <i class="fa-solid fa-user icon"></i>
                    <input type="text" id="loginEmail" placeholder="Nhập email hoặc SĐT..." required autocomplete="username">
                </div>
                <small class="error-text" id="loginEmailError"></small>
            </div>

            <div class="form-group">
                <label for="loginPassword">Mật khẩu <span class="required-star">*</span></label>
                <div class="input-box">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="loginPassword" placeholder="Nhập mật khẩu..." required autocomplete="current-password">
                    <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePassword('loginPassword', this)"></i>
                </div>
                <small class="error-text" id="loginPasswordError"></small>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe"> Ghi nhớ đăng nhập
                </label>
                <a href="quenmatkhau.html" class="forgot-pass">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-submit">ĐĂNG NHẬP</button>
        </form>

        <!-- FORM ĐĂNG KÝ -->
        <form id="registerForm" class="auth-form" novalidate>
            <h2>Tạo Tài Khoản Mới</h2>

            <div class="form-group">
                <label for="regName">Họ và Tên <span class="required-star">*</span></label>
                <div class="input-box">
                    <i class="fa-solid fa-id-card icon"></i>
                    <input type="text" id="regName" placeholder="Nhập họ và tên..." required autocomplete="name">
                </div>
                <small class="error-text" id="regNameError"></small>
            </div>

            <div class="form-group">
                <label for="regEmail">Email <span class="required-star">*</span></label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="email" id="regEmail" placeholder="Nhập email..." required autocomplete="email">
                </div>
                <small class="error-text" id="regEmailError"></small>
            </div>

            <div class="form-group">
                <label for="regPassword">Mật khẩu <span class="required-star">*</span></label>
                <div class="input-box">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="regPassword" placeholder="Tối thiểu 8 ký tự gồm chữ và số..." required autocomplete="new-password">
                    <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePassword('regPassword', this)"></i>
                </div>
                <small class="error-text" id="regPasswordError"></small>
            </div>

            <div class="form-group">
                <label for="regConfirmPassword">Xác nhận Mật khẩu <span class="required-star">*</span></label>
                <div class="input-box">
                    <i class="fa-solid fa-shield-halved icon"></i>
                    <input type="password" id="regConfirmPassword" placeholder="Nhập lại mật khẩu..." required autocomplete="new-password">
                    <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePassword('regConfirmPassword', this)"></i>
                </div>
                <small class="error-text" id="regConfirmPasswordError"></small>
            </div>

            <button type="submit" class="btn-submit">TẠO TÀI KHOẢN</button>
        </form>
    </div>

    <script src="js_login.js"></script>
    <script src="i18n.js"></script>
<script src="auth.js"></script>
</body>
</html>
