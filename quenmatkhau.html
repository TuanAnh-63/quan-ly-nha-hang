<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - Nhà Hàng</title>
    <!-- Font Awesome dùng cho Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Đã sửa đúng đường dẫn CSS -->
    <link rel="stylesheet" href="css_login.css">
</head>
<body>
    <div class="auth-wrapper">
        <h2 style="text-align: center; margin-bottom: 12px; color: var(--primary-dark);">Khôi Phục Mật Khẩu</h2>
        <p style="font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 22px; line-height: 1.5;">
            Nhập email đã đăng ký tài khoản. Hệ thống sẽ gửi liên kết đặt lại mật khẩu cho bạn.
        </p>

        <form id="forgotForm" novalidate>
            <div class="form-group">
                <label for="forgotEmail">Email khôi phục <span class="required-star">*</span></label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="email" id="forgotEmail" placeholder="Nhập email của bạn..." required autocomplete="email">
                </div>
                <small class="error-text" id="forgotEmailError"></small>
            </div>

            <button type="submit" class="btn-submit" style="margin-top: 10px;">GỬI YÊU CẦU</button>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="html_login.html" class="forgot-pass">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại Đăng nhập
                </a>
            </div>
        </form>
    </div>

    <!-- Script xử lý gửi yêu cầu -->
    <script>
        document.getElementById('forgotForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const emailInput = document.getElementById('forgotEmail').value.trim();
            const emailError = document.getElementById('forgotEmailError');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailInput === '') {
                emailError.innerText = 'Vui lòng nhập Email!';
                return;
            }

            if (!emailRegex.test(emailInput)) {
                emailError.innerText = 'Định dạng Email không hợp lệ!';
                return;
            }

            emailError.innerText = '';
            alert('Yêu cầu khôi phục mật khẩu đã được gửi đến: ' + emailInput + '\nVui lòng kiểm tra hộp thư email của bạn!');
            window.location.href = 'html_login.html';
        });
    </script>
</body>
</html>
